name: emefa
description: Commande de pièce automomobile
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  image_picker: ^1.1.2
  http: ^1.2.0
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  intl_phone_field: ^3.0.1
  # voice recording is temporarily disabled due to build issues with the
  # `record` plugin; re-enable later when plugin or build config is updated.

dev_dependencies:

  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

flutter_native_splash:
  color: "#ffffff"          # Couleur de fond (ici blanc)
  image: assets/logo.png    # Ton logo
  android: true
  ios: true
  web: false

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

dependency_overrides:
  meta: ^1.17.0
  characters: ^1.4.1
  material_color_utilities: ^0.13.0
  test_api: ^0.7.7
